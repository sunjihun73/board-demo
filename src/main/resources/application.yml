spring:
  application:
    name: board-demo

  # 계정 정보는 .env 로 분리 (없으면 OS 환경변수를 사용)
  config:
    import: "optional:file:./.env[.properties]"

  # JSP ViewResolver
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  # DB : 로컬 Docker PostgreSQL (docker-compose.yml 참고)
  datasource:
    url: jdbc:postgresql://localhost:5432/boarddb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  # 기동 시마다 schema.sql -> data.sql 실행 (교육용: 항상 초기 상태로 복귀)
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# MyBatis
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.example.board.domain
  configuration:
    map-underscore-to-camel-case: true

# 교육용 로그인 계정 (.env 참고)
demo:
  login:
    username: ${DEMO_LOGIN_USERNAME}
    password: ${DEMO_LOGIN_PASSWORD}

logging:
  level:
    com.example.board: DEBUG
