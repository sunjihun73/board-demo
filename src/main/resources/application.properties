spring.application.name=board-demo

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JSP ViewResolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# DB : 로컬 Docker PostgreSQL (docker-compose.yml 참고)
spring.datasource.url=jdbc:postgresql://localhost:5432/boarddb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=boarduser
spring.datasource.password=boardpw
spring.datasource.hikari.maximum-pool-size=10

# 기동 시마다 schema.sql -> data.sql 실행 (교육용: 항상 초기 상태로 복귀)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# MyBatis
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.example.board.domain
mybatis.configuration.map-underscore-to-camel-case=true

# 교육용 로그인 계정
demo.login.username=pmuser
demo.login.password=pm1234

logging.level.com.example.board=DEBUG
